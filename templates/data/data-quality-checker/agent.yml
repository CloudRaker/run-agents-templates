name: Data quality checker
mode: zeroshot
triggers:
  schedule: "0 6 * * *"
connectors:
  - supabase
limits:
  max_steps: 60
output_schema:
  type: object
  required: [status, checks_run, failures]
  properties:
    status:
      type: string
      enum: [pass, warn, fail]
    checks_run: { type: integer }
    failures:
      type: array
      items:
        type: object
        required: [check, table, severity, measured, threshold]
        properties:
          check: { type: string }
          table: { type: string }
          column: { type: string }
          severity:
            type: string
            enum: [warn, fail]
          measured: { type: string }
          threshold: { type: string }
          query: { type: string }
    errors:
      type: array
      items: { type: string }
