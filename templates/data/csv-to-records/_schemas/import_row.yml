name: import_row
label: Import row
label_field: name
fields:
  name:
    type: text
    required: true
  email:
    type: email
  company:
    type: text
  amount:
    type: number
  date:
    type: date
  status:
    type: select
    options: [active, inactive, unknown]
  notes:
    type: long_text
