name: Proposal drafter
mode: zeroshot
triggers:
  http: true
connectors:
  - hubspot
  - notion
limits:
  max_steps: 40
input_schema:
  type: object
  required: [deal_id, scope_notes]
  properties:
    deal_id:
      type: string
      description: The HubSpot deal id.
    scope_notes:
      type: string
      description: What the customer buys, the goals and any constraints.
    language:
      type: string
      description: Optional. The language of the proposal. Default English.
output_schema:
  type: object
  required: [status]
  properties:
    status:
      type: string
      enum: [drafted, deal_not_found]
    file_name: { type: string }
    title: { type: string }
    open_questions:
      type: array
      items: { type: string }
