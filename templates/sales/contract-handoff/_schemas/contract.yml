name: contract
label: Contract
label_field: customer
fields:
  customer:
    type: text
    required: true
  file_name:
    type: text
    required: true
    unique: true
  provider:
    type: text
  signed_date:
    type: date
  start_date:
    type: date
  end_date:
    type: date
  term_months:
    type: number
  auto_renewal:
    type: boolean
  notice_days:
    type: number
  payment_terms:
    type: text
  special_clauses:
    type: long_text
  handoff:
    type: long_text
  status:
    type: select
    options: [recorded, needs_review]
