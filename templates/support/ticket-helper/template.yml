name: Ticket helper
category: support
description: Drafts answers to customer conversations in Intercom for a support agent to review.
icon: lifebuoy
what_it_does: |
  Reads an Intercom conversation and the customer history.
  Drafts an answer in the tone of your team.
  Asks the support agent a question when facts are missing.
  Never sends a message to the customer.
connectors:
  - id: intercom
    required: true
    purpose: Read conversations, contacts and help center articles. Add internal notes.
tags: [support, drafts, intercom]
