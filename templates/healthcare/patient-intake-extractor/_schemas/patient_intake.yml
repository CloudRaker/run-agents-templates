name: patient_intake
label: Patient intake
label_field: patient_name
fields:
  patient_name:
    type: text
    required: true
  date_of_birth:
    type: date
    required: true
  sex:
    type: text
  phone:
    type: phone
  email:
    type: email
  address:
    type: address
  insurance_payer:
    type: text
  insurance_member_id:
    type: text
  insurance_group:
    type: text
  allergies:
    type: long_text
  medications:
    type: long_text
  reason_for_visit:
    type: long_text
  missing_fields:
    type: long_text
  status:
    type: select
    options: [complete, incomplete]
  source_files:
    type: long_text
