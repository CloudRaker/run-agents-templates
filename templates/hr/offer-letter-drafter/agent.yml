name: Offer letter drafter
mode: zeroshot
triggers:
  http: true
limits:
  max_steps: 15
input_schema:
  type: object
  required: [candidate, role, salary, start_date, manager]
  properties:
    candidate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string }
        address: { type: string }
    role: { type: string }
    salary:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string, description: ISO 4217 code. }
        period:
          type: string
          enum: [year, month, hour]
    start_date: { type: string, description: ISO 8601 date. }
    manager: { type: string }
    employment_type:
      type: string
      enum: [full_time, part_time, fixed_term]
    extras:
      type: string
      description: Optional. Bonus, equity or other terms as plain text.
    expires_on: { type: string, description: Optional. The last date to accept. }
output_schema:
  type: object
  required: [status]
  properties:
    status:
      type: string
      enum: [drafted, needs_input]
    file_name: { type: string }
    check_before_sending:
      type: array
      items: { type: string }
    missing:
      type: array
      items: { type: string }
